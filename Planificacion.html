<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InnovaMed - Planificación Quirúrgica</title>
    <style>
        :root {
            /* Paleta quirúrgica sobria: azules alternados y estados de alto contraste */
            --bg-gradient: linear-gradient(135deg, #102a43 0%, #174967 55%, #236b91 100%);
            --app-bg: #e7eff7;
            --card-bg: #f3f7fc;
            --primary-blue: #174f78;
            --dark-blue: #123b5d;
            --accent-blue: #2878b5;
            --border-light: #b9d0e4;
            --text-main: #102a43;
            --text-muted: #486581;

            --row-blue-a: #eaf3fc;
            --row-blue-b: #d5e7f7;
            --row-hover: #c4def3;

            /* Estados intensos, distinguibles a simple vista */
            --badge-prog-bg: #075db8;
            --badge-prog-border: #064b93;
            --badge-ret-bg: #ef6c00;
            --badge-ret-border: #c65300;
            --badge-fin-bg: #218739;
            --badge-fin-border: #176b2b;
            --badge-init-bg: #087f8c;
            --badge-init-border: #06616b;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--app-bg);
            color: var(--text-main);
            margin: 0;
            padding: 25px;
            display: flex;
            flex-direction: column;
            min-height: 95vh;
        }

        .container {
            max-width: 1450px;
            margin: 0 auto;
            flex: 1;
            width: 100%;
        }

        /* ENCABEZADO MODERNO */
        header {
            background: linear-gradient(135deg, #ffffff 0%, #f4f8fc 100%);
            padding: 22px 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(11, 37, 69, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border: 1px solid var(--border-light);
        }

        .logo-container img {
            height: 65px;
            object-fit: contain;
        }

        .header-title-container {
            text-align: center;
            flex-grow: 1;
        }

        h1 {
            margin: 0;
            color: var(--dark-blue);
            font-size: 26px;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            font-weight: 800;
        }

        .date-badge {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 6px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #0d532a;
            background: #e8f8f0;
            padding: 10px 16px;
            border-radius: 30px;
            font-weight: 700;
            border: 1px solid #b2e8cf;
            box-shadow: 0 2px 8px rgba(46, 125, 50, 0.1);
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            background-color: #2e7d32;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 125, 50, 0.6); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(46, 125, 50, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 125, 50, 0); }
        }

        /* TARJETA CONTENEDORA DE TABLA */
        .table-card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(11, 37, 69, 0.08);
            overflow: hidden;
            border: 1px solid #b9d0e4;
        }

        .date-section-header {
            background: linear-gradient(90deg, #d5e7f7 0%, #b8d4ec 100%);
            padding: 15px 25px;
            font-weight: 800;
            color: var(--dark-blue);
            border-bottom: 2px solid var(--border-light);
            font-size: 15px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* TABLA ELEGANTE */
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        th {
            background-color: #174f78;
            color: #ffffff;
            padding: 16px 14px;
            font-weight: 800;
            border-bottom: 2px solid #0d3858;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.8px;
        }

        td {
            padding: 16px 14px;
            border-bottom: 1px solid #edf2f7;
            color: var(--text-main);
            font-weight: 750;
            vertical-align: middle;
            white-space: pre-line;
            line-height: 1.4;
        }

        tbody tr:nth-child(odd) {
            background-color: var(--row-blue-a);
        }

        tbody tr:nth-child(even) {
            background-color: var(--row-blue-b);
        }

        tbody td {
            border-bottom: 1px solid #b9d0e4;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover {
            background-color: var(--row-hover);
            transition: background-color 0.2s ease;
        }

        /* BURBUJAS DE ESTATUS PROFESIONALES */
        .badge {
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 800;
            color: #ffffff !important;
            display: inline-block;
            min-width: 88px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(11, 37, 69, 0.18);
            letter-spacing: 0.3px;
            border: 1.5px solid transparent;
        }

        .badge-programada {
            background-color: var(--badge-prog-bg);
            border-color: var(--badge-prog-border);
        }

        .badge-retrasada {
            background-color: var(--badge-ret-bg);
            border-color: var(--badge-ret-border);
        }

        .badge-finalizada {
            background-color: var(--badge-fin-bg);
            border-color: var(--badge-fin-border);
        }

        .badge-iniciada {
            background-color: var(--badge-init-bg);
            border-color: var(--badge-init-border);
        }

        .bold-role {
            font-weight: 800;
            color: #0b2545;
        }

        .highlight-underline {
            text-decoration: underline;
            text-decoration-color: var(--accent-blue);
            text-underline-offset: 3px;
        }

        .time-cell {
            font-family: 'Courier New', Courier, monospace;
            font-weight: 800;
            color: #0f2027;
            font-size: 14.5px;
        }

        /* PIE DE PÁGINA */
        footer {
            text-align: center;
            padding: 30px 0 10px 0;
            color: var(--text-muted);
            font-size: 13px;
            font-style: italic;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ENCABEZADO -->
        <header>
            <div class="logo-container">
                <img src="https://lh3.googleusercontent.com/d/1rTKfE0cHm5Y_tqnwzwLwDOiRNs4X9h_6=s800" alt="InnovaMed Logo">
            </div>
            
            <div class="header-title-container">
                <h1>Planificación Quirúrgica del Día</h1>
                <div class="date-badge" id="current-date-display">Fecha actual</div>
            </div>

            <div class="status-indicator">
                <div class="pulse-dot"></div>
                <span>En Vivo (Sincronizado)</span>
            </div>
        </header>

        <!-- TABLA PRINCIPAL -->
        <div class="table-card">
            <div class="date-section-header">
                📅 Agenda General del Día
            </div>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Quirófano</th>
                            <th>Paciente</th>
                            <th>Diagnóstico</th>
                            <th>Plan</th>
                            <th>Cirujanos</th>
                            <th>Enfermería</th>
                            <th>Anestesiólogo</th>
                            <th>Hora</th>
                            <th>Inicio</th>
                            <th>Finalización</th>
                            <th>Estatus</th>
                        </tr>
                    </thead>
                    <tbody id="planning-table-body">
                        <tr>
                            <td colspan="11" style="text-align: center; color: var(--dark-blue); padding: 40px;">
                                🔄 Consultando base de datos en tiempo real...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- PIE DE PÁGINA -->
    <footer>
        Tecnología creada con InnovaMed.app
    </footer>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby2DRWAG43_a847b1KZvzdU3KFSFdf_wIuPkEgyKPA8nreYxXzT5uFcfmd1ldcqdzCfpw/exec";

        async function cargarAgenda() {
            const tbody = document.getElementById('planning-table-body');
            try {
                const response = await fetch(WEB_APP_URL);
                let data = await response.json();

                if (data.error) {
                    tbody.innerHTML = `<tr><td colspan="11" style="text-align: center; color: red;">Error al cargar: ${data.error}</td></tr>`;
                    return;
                }

                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="11" style="text-align: center; color: var(--dark-blue); padding: 40px;">No hay cirugías programadas para el día de hoy.</td></tr>`;
                    return;
                }

                // Ordenar por hora (de la más temprana a la más tardía)
                data.sort((a, b) => {
                    const horaA = a['Hora'] || '99:99:99';
                    const horaB = b['Hora'] || '99:99:99';
                    return horaA.localeCompare(horaB);
                });

                let htmlContent = '';
                const ahora = new Date();

                data.forEach(row => {
                    const quirofano = row['Quirofano'] || '';
                    const paciente = row['Nombre y Apellido'] || '';
                    const diagnostico = row['Diagnostico'] || '';
                    const plan = row['Plan'] || '';
                    const cirujano = row['Cirujanos'] || row['Cirujano'] || '';
                    const enfermeria = row['Enfermería'] || '';
                    const anestesiologo = row['Anestesiologo'] || '';
                    const horaProg = row['Hora'] || '';
                    const inicio = row['Inicio'] || '';
                    const finalizacion = row['Finalización'] || '-';
                    
                    let estatusSheet = row['Estatus'] ? row['Estatus'].trim().toLowerCase() : '';
                    let estatusFinal = 'Programada';
                    let badgeClass = 'badge-programada';

                    // Lógica de Estatus
                    if (estatusSheet === 'finalizada') {
                        estatusFinal = 'Finalizada';
                        badgeClass = 'badge-finalizada';
                    } else if (inicio && inicio !== '-' && inicio.trim() !== '') {
                        estatusFinal = 'Iniciada';
                        badgeClass = 'badge-iniciada';
                    } else if (horaProg) {
                        const partesHora = horaProg.split(':');
                        const hProg = parseInt(partesHora[0], 10) || 0;
                        const mProg = parseInt(partesHora[1], 10) || 0;
                        
                        const fechaProg = new Date();
                        fechaProg.setHours(hProg, mProg, 0, 0);

                        if (ahora > fechaProg) {
                            estatusFinal = 'Retrasada';
                            badgeClass = 'badge-retrasada';
                        } else {
                            estatusFinal = 'Programada';
                            badgeClass = 'badge-programada';
                        }
                    }

                    if (paciente || quirofano) {
                        htmlContent += `
                            <tr>
                                <td><strong class="highlight-underline">${quirofano}</strong></td>
                                <td>${paciente}</td>
                                <td>${diagnostico}</td>
                                <td>${plan}</td>
                                <td><span class="bold-role">${cirujano}</span></td>
                                <td><span class="bold-role">${enfermeria}</span></td>
                                <td>${anestesiologo}</td>
                                <td class="time-cell">${horaProg}</td>
                                <td class="time-cell">${inicio || '-'}</td>
                                <td class="time-cell">${finalizacion}</td>
                                <td><span class="badge ${badgeClass}">${estatusFinal}</span></td>
                            </tr>
                        `;
                    }
                });

                tbody.innerHTML = htmlContent || `<tr><td colspan="11" style="text-align: center; color: var(--dark-blue); padding: 40px;">No hay registros válidos para mostrar hoy.</td></tr>`;

            } catch (error) {
                console.error("Error:", error);
                tbody.innerHTML = `<tr><td colspan="11" style="text-align: center; color: red; padding: 40px;">Error de conexión con la base de datos.</td></tr>`;
            }
        }

        window.onload = function() {
            cargarAgenda();
            setInterval(cargarAgenda, 15000);

            const now = new Date();
            const options = { day: '2-digit', month: '2-digit', year: 'numeric' };
            document.getElementById('current-date-display').innerText = `Fecha: ${now.toLocaleDateString('es-ES', options)}`;
        };
    </script>
</body>
</html>
